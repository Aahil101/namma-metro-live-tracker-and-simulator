name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # lets you deploy by hand from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # no dependencies to install — the engine tests are plain Node
      - name: Simulation tests
        run: node tools/test-sim.mjs
      - name: API tests
        run: node tools/test-api.mjs
      - name: Data integrity
        run: node tools/verify.mjs
      - name: Deploy preflight
        run: node tools/preflight.mjs
      - name: Encoding audit
        run: node tools/audit-encoding.mjs
      - name: README check
        run: node tools/check-readme.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
